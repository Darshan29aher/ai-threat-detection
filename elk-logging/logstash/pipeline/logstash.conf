 input {

  beats {

    port => 5044

  }

}


filter {

  # Clean up malformed Docker label metadata

  mutate {

    remove_field => [ "[container][labels]", "[container][labels][org_opencontainers_image_created]" ]

  }


  if [container][name] {

    mutate {

      add_field => { "service_name" => "%{[container][name]}" }

    }

  }


  # Parse standard Apache Combined/Common Log format

  grok {

    match => { "message" => "(?:%{IPORHOST:client_ip} - - \[%{HTTPDATE:timestamp}\] \"%{WORD:http_method} %{NOTSPACE:request_path} HTTP/%{NUMBER:http_version}\" %{NUMBER:status_code:int} %{NUMBER:body_bytes_sent:int})|(?:%{GREEDYDATA:raw_log})" }

  }


  # Run threat scanning ONLY on application container logs (ignoring internal ELK containers)

  if [service_name] and [service_name] !~ /(?i)(logstash|kibana|elasticsearch|filebeat)/ {


    mutate {

      add_field => { "full_log_text" => "%{message} %{request_path} %{raw_log}" }

    }


    # 1. XSS Tagging

    if [full_log_text] =~ /(?i)(vulnerabilities\/xss|<script|%3Cscript|javascript:|onerror=|alert\()/ {

      mutate { add_tag => [ "xss_attempt" ] }

    }

    # 2. SQL Injection Tagging

    else if [full_log_text] =~ /(?i)(vulnerabilities\/sqli|\bselect\b|\bunion\b|or%201%3D1|or 1=1|%27|'|--)/ {

      mutate { add_tag => [ "sqli_attempt" ] }

    }

    # 3. Brute Force / Invalid Login

    else if [full_log_text] =~ /(?i)(vulnerabilities\/brute.*failed|login failed|status_code=401|invalid credentials)/ {

      mutate { add_tag => [ "brute_force_attempt" ] }

    }

    # 4. Valid Login

    else if [full_log_text] =~ /(?i)(login.php.*successful|authenticated|vulnerabilities\/brute.*success)/ {

      mutate { add_tag => [ "valid_login" ] }

    }

    # 5. CSRF Tagging

    else if [full_log_text] =~ /(?i)(vulnerabilities\/csrf|user_token)/ {

      mutate { add_tag => [ "csrf_attempt" ] }

    }


    mutate {

      remove_field => [ "full_log_text" ]

    }

  }

}


output {

  elasticsearch {

    hosts => ["http://elasticsearch:9200"]

    index => "logstash-docker-%{+YYYY.MM.dd}"

  }

} 
