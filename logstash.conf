input {
  beats {
    port => 5044
  }
}

filter {
  # Clean up malformed Docker label metadata
  mutate {
    remove_field => [ "[container][labels]" ]
    remove_tag => [ "beats_input_codec_plain_applied" ]
  }

  if [container][name] {
    mutate {
      add_field => { "service_name" => "%{[container][name]}" }
    }
  }

  # Parse standard Apache Combined/Common Log format
  grok {
    match => { "message" => "(?:%{IPORHOST:client_ip} - - \[%{HTTPDATE:timestamp}\] \"%{WORD:http_method} %{NOTSPACE:request_path} HTTP/%{NUMBER:http_version}\" %{NUMBER:status_code:int} %{NUMBER:body_bytes_sent:int})|(?:%{GREEDYDATA:raw_log})" }
    tag_on_failure => [ "_apache_grok_failure" ]
  }

  # Run threat scanning ONLY on application container logs (ignoring internal ELK containers)
  if [service_name] and [service_name] !~ /(?i)(logstash|kibana|elasticsearch|filebeat)/ {

    # FIX #3: guard against missing fields instead of blindly interpolating them
    if [request_path] {
      mutate {
        add_field => { "full_log_text" => "%{message} %{request_path}" }
      }
    } else {
      mutate {
        add_field => { "full_log_text" => "%{message}" }
      }
    }

    # FIX #1: separate "if" blocks instead of "else if" so attacks can be tagged independently
    # FIX #2: removed lone ' and -- from SQLi pattern (too many false positives)

    # 1. XSS Tagging
    if [full_log_text] =~ /(?i)(vulnerabilities\/xss|<script|%3Cscript|javascript:|onerror=|alert\()/ {
      mutate { add_tag => [ "xss_attempt" ] }
    }

    # 2. SQL Injection Tagging
    if [full_log_text] =~ /(?i)(vulnerabilities\/sqli|union.*select|or%201%3D1|or 1=1|drop table|sleep\()/ {
      mutate { add_tag => [ "sqli_attempt" ] }
    }

    # 3. Brute Force / Invalid Login
    if [full_log_text] =~ /(?i)vulnerabilities\/brute.*username=.*password=/ {
      mutate { add_tag => [ "brute_force_attempt" ] }
    }	
    # 4. Valid Login
    if [full_log_text] =~ /(?i)(login.php.*successful|authenticated|vulnerabilities\/brute.*success)/ {
      mutate { add_tag => [ "valid_login" ] }
    }

    # 5. CSRF Tagging
    if [full_log_text] =~ /(?i)(vulnerabilities\/csrf|user_token)/ {
      mutate { add_tag => [ "csrf_attempt" ] }
    }

    # 6. Path Traversal / Local File Inclusion (LFI) Tagging
    if [full_log_text] =~ /(?i)(vulnerabilities\/fi\/.*(\.\.\/|\.\.%2f|etc\/passwd|phpinfo))/ {
      mutate { add_tag => [ "lfi_attempt" ] }
    }

    mutate {
      remove_field => [ "full_log_text" ]
    }
  }
}
output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "logstash-docker-%{+YYYY.MM.dd}"
  }
}
